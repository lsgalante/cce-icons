<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Electron: three wireframe orbit ellipses, 60 degrees apart, around a solid nucleus. -->
<g fill="none" stroke="#ffffff" stroke-width="2.5">
    <ellipse cx="20" cy="20" rx="15" ry="5.5" />
    <ellipse cx="20" cy="20" rx="15" ry="5.5" transform="rotate(60 20 20)" />
    <ellipse cx="20" cy="20" rx="15" ry="5.5" transform="rotate(120 20 20)" />
  </g>
  <circle cx="20" cy="20" r="3.75" fill="#ffffff" />
</svg>
