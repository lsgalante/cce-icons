<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Chain link: two rounded links at 45 degrees, linked through each other.
       Wireframe at stroke 4, the outline weight of mail.svg; the near link
       is drawn last so it passes over the far one. -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" transform="rotate(-45 20 20)">
    <rect x="4" y="14" width="18" height="12" rx="6" />
    <rect x="18" y="14" width="18" height="12" rx="6" />
  </g>
</svg>
