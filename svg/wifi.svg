<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Wi-Fi, wireframe: three arcs fanning up from a dot, all concentric
       on the dot and spanning 45 degrees either side of vertical. Stroke 4
       with round caps, the outline weight of mail.svg. The radii step by
       7.5, which leaves a 3.5 gap between strokes — the dot's own edge to
       the first arc's inner edge is the same 3.5, so the four marks read
       as evenly spaced rather than as a dot and a separate fan. The whole
       glyph is inked 6..33.5, centered on the box like the rest of the
       set. -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M14.34 25.34 A8 8 0 0 1 25.66 25.34" />
    <path d="M9.04 20.04 A15.5 15.5 0 0 1 30.96 20.04" />
    <path d="M3.74 14.74 A23 23 0 0 1 36.26 14.74" />
  </g>
  <circle cx="20" cy="31" r="2.5" fill="#ffffff" />
</svg>
