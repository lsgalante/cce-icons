<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Fingerprint: four ridges as nested arches, open at the foot, around a
       small core loop. The ridges stay open — closed rings read as a target,
       and the nested ellipses this replaced tapered to a shared point and read
       as an onion. The arches are a little taller than wide (a fingertip), and
       their feet step up as they nest, which pulls the eye to the core the way
       a whorl does. The break at the top of the second ridge is the one bit of
       ridge texture: it survives at pad size, where breaks on the shoulders
       blurred into noise. Symmetric about x=20 on purpose. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
    <path d="M5.50,36 V19 A14.5,16.5 0 0 1 20.00,2.50 A14.5,16.5 0 0 1 34.50,19.00 V36"/>
    <path d="M10.00,33 V19 A10,12 0 0 1 17.41,7.41"/>
    <path d="M22.59,7.41 A10,12 0 0 1 30.00,19.00 V33"/>
    <path d="M14.40,30 V19 A5.6,7.4 0 0 1 20.00,11.60 A5.6,7.4 0 0 1 25.60,19.00 V30"/>
    <path d="M18.30,26 V19 A1.7,2.8 0 0 1 20.00,16.20 A1.7,2.8 0 0 1 21.70,19.00 V26"/>
  </g>
</svg>
